<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 px-6 py-12 font-sans text-slate-100">
    <main class="mx-auto max-w-6xl">
        <header class="mb-10 text-center">
            <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-indigo-400">Our community</p>
            <h1 class="text-4xl font-bold tracking-tight text-slate-100">Meet the team</h1>
            <p class="mx-auto mt-3 max-w-xl text-slate-400">A talented group of people building meaningful experiences together.</p>
        </header>

        <section class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-label="Team members">
         
           
        </section>

        <div class="mt-8 text-center">
            <button type="button" onclick="location.reload()"
                class="rounded-lg bg-indigo-500 px-5 py-2.5 font-semibold text-white shadow-lg transition hover:bg-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-slate-950">
                Refresh
            </button>
        </div>
        
    </main>
</body>
<script src="script.js"></script>
</html>
